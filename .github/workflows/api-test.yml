  #   permissions:
  #     contents: read
  #     pages: write
  #     id-token: write
  #   steps:
  #     - uses: actions/download-artifact@v4
  #       with:
  #         name: allure-report
  #         path: public
  #     - uses: actions/upload-pages-artifact@v3
  #       with:
  #         path: public/allure-report
  #     - uses: actions/deploy-pages@v4
  # ========================================================================