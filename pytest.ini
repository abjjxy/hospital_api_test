[pytest]
# ==========================================================================
# 用例发现规则
# ==========================================================================
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 让项目根目录进入 sys.path，这样 config/ common/ apis/ 才能被 import
pythonpath = .

# 中文参数 id 不再转义成 正常，报告里直接显示中文用例名
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

# ==========================================================================
# 默认执行参数
#   -s              : 显示 print 输出（配合 log_cli 一起用）
#   -ra             : 结束汇总时列出所有非 passed 的用例
#   --strict-markers: 未注册的 marker 直接报错，防止 @pytest.mark.smok 这种拼写错误静默失效
#   --strict-config : ini 里有未知配置项直接报错
#   --alluredir     : allure 原始结果目录
#   --clean-alluredir: 每次执行清空旧结果，避免和上一次混淆
# ==========================================================================
addopts = -s -ra --strict-markers --strict-config --alluredir=reports/allure-results --clean-alluredir

# ==========================================================================
# 自定义 marker 注册（配合 --strict-markers 使用）
# ==========================================================================
markers =
    smoke: 冒烟用例，每次提交/部署前必须通过
    regression: 回归用例
    negative: 异常 / 边界场景
    slow: 耗时较长的用例

# xfail 的用例如果意外通过了，也判定为失败（严格模式）
xfail_strict = true

# ==========================================================================
# 日志
# ==========================================================================
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)-20s | %(message)s
log_cli_date_format = %H:%M:%S

log_file = reports/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-7s | %(name)-20s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ==========================================================================
# 警告过滤
# ==========================================================================
filterwarnings =
    ignore::DeprecationWarning:requests.*
    ignore::DeprecationWarning:urllib3.*

# ==========================================================================
# 超时（需安装 pytest-timeout，安装后取消注释）
# ==========================================================================
# timeout = 60
# timeout_method = thread